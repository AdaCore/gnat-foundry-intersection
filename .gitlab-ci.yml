variables:
  BASE_URL: https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_DEPENDENCY_PROXY_SERVER}
  ANOD: $BASE_URL/eng/shared/anod
  INTERNAL_ALIRE_SCRIPTS: $BASE_URL/eng/devops/internal-alire-scripts.git
  INTERNAL_ALIRE_INDEX: $BASE_URL/eng/devops/internal-alire-index
  UV_PYTHON_DOWNLOADS: never

stages:
  - validate
  - build
  - check

include:
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/check-issue@~latest
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: check

default:
  interruptible: true

.default_rules:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.x86_64-linux-pro:
  variables:
    OS: Linux
    PLATFORM: x86_64-linux
  services:
    - image:e3
    - cpu:4

.x86_64-linux-community:
  variables:
    OS: Linux
    PLATFORM: x86_64-linux
  services:
    - image:serotonic
    - cpu:4
    # Allow connecting to the internet
    - security_group:GitLabRunnerTasksExecPrivilegedSG

.uv:
  extends:
    - .default_rules
  services:
    - image:e3-py313
    - cpu:1
  before_script:
    - pip install uv
    - unset VIRTUAL_ENV

# Test the `reqs` requirements validation tool, then validate the requirements
# with it.
validate-requirements:
  stage: validate
  extends:
    - .uv
  script:
    - make test-reqs-engine
    - make validate-reqs

# Lint, type-check and check formatting (the report engine has its own job).
check:
  stage: validate
  extends:
    - .uv
  script:
    # Install `alr` and `gnatformat` with `anod`
    - !reference [.pro, before_script]
    - anod install gnatformat --qualifier=stable
    - eval $(anod printenv gnatformat --qualifier=stable)

    # Run the checks
    - make check-ada check-shell check-python-reqs check-target-test-parity

# Check and test the report engine; its deps are only on pypi.org (which its uv.lock pins).
check-report:
  stage: validate
  extends:
    - .uv
  services:
    - image:e3-py313
    - cpu:1
    - security_group:GitLabRunnerTasksExecPrivilegedSG
  script:
    # The env vars outrank the runner image's system-level uv configuration.
    - unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL UV_INDEX_URL UV_EXTRA_INDEX_URL
        UV_INDEX
    - export UV_DEFAULT_INDEX="https://pypi.org/simple"
    - make check-python-report
    - make test-report-engine

.pro:
  stage: build
  extends:
     - .x86_64-linux-pro
     - .default_rules
  before_script:
    # Install uv
    - pip install uv
    - unset VIRTUAL_ENV

    # Deploy a sandbox
    - anod init wave
    - export ANOD_DEFAULT_SANDBOX_DIR=$(pwd)/wave

    # Install alire
    - anod install alire
    - eval $(anod printenv alire)

    # Setup alire to use our local index
    - alr -n index --name=adacore --add=git+$INTERNAL_ALIRE_INDEX

    # Setup alire to use our downloader helper
    - git clone --depth=1 $INTERNAL_ALIRE_SCRIPTS /tmp/internal-alire-scripts
    - alr -n settings --global --set --builtin origins.archive.download_cmd \
        "/tmp/internal-alire-scripts/adacore_registries_download.py"

    # Sanity check
    - alr --version

# Native build and test with coverage.
pro:x86_64-linux:
  extends: .pro
  script:
    # Install stable specs
    - for spec in gnat gnatformat spark2014 gnatcov gnattest langkit_support libadalang ; do
        anod install $spec --qualifier=stable ;
        eval $(anod printenv $spec --qualifier=stable) ;
      done
    - anod install libgpr2 --qualifier=bare,stable
    - eval $(anod printenv libgpr2 --qualifier=bare,stable)

    # We're using the pro version
    # commented out for now: we're setting up with anod, see above.
    # - make setup-pro

    # Build
    - make build-native

    # Test (test w/ non-instrumented harness build)
    - make test

    # Test with coverage
    - make coverage-instrumentation
    - make coverage-build
    - make coverage-test
    - make coverage-report-html
    - make coverage-report-cobertura
    - make coverage-report-text

    # Publish the HTML coverage report
    - gnatcov_report_dir=$(pwd)/reports/coverage/
    - |
      if [[ $CI_PIPELINE_SOURCE = "merge_request_event" ]]; then
        target_subdir=MRs/$CI_MERGE_REQUEST_IID ;
      else
        target_subdir=$CI_COMMIT_BRANCH ;
      fi
    - publish-pages $gnatcov_report_dir/html --target-subdir $target_subdir --expires 30

    # Compute coverage precentage
    - cobertura=$gnatcov_report_dir/cobertura/cobertura.xml
    - line_rate=$(cat $cobertura | grep -o 'line-rate="\([^"]\+\)"' | head -1 | grep -o '[0-9.]\+' || true )
    - line_perc=$(python -c "print($line_rate * 100)")
    - >
      echo "Line Coverage: $line_perc"

  coverage: '/^Line Coverage:\s+(\d+\.\d+)$/'
  artifacts:
    when: always #  Upload on errors too
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/cobertura/cobertura.xml
    paths:
      # Upload the entire reports/ directory as an artifact
      - reports/

# The tracer's own integration test. A job of its own, and *not* allow_failure:
# `pro:trace-check` below is red on purpose while the work list is burned down,
# so a regression in the check extraction it reads would hide there.
pro:tracer-test:
  extends: .pro
  script:
    # Install the specs the tracer needs to build
    - for spec in gnat langkit_support libadalang ; do
        anod install $spec --qualifier=stable ;
        eval $(anod printenv $spec --qualifier=stable) ;
      done
    - anod install libgpr2 --qualifier=bare,stable
    - eval $(anod printenv libgpr2 --qualifier=bare,stable)

    - make test-tracer

pro:trace-check:
  extends: .pro
  allow_failure: true  # Drop allow_failure after the tracing becomes green
  script:
    # Install the specs the tracer and the harness generator need
    - for spec in gnat gnattest langkit_support libadalang ; do
        anod install $spec --qualifier=stable ;
        eval $(anod printenv $spec --qualifier=stable) ;
      done
    - anod install libgpr2 --qualifier=bare,stable
    - eval $(anod printenv libgpr2 --qualifier=bare,stable)

    - make build-native
    - make trace-check

# Target build, and the on-target testsuite: cross-built with GNAT Pro and run
# under QEMU. No coverage: gnatcov stays a native concern (see pro:x86_64-linux).
pro:arm-elf:
  extends: .pro
  services:
    - image:serotonic
    - cpu:4
  script:
    # The cross compiler, and gnattest to generate the cross harness.
    - anod install gnat --qualifier=stable --target=arm-elf
    - eval $(anod printenv gnat --qualifier=stable --target=arm-elf)
    - anod install gnattest --qualifier=stable
    - eval $(anod printenv gnattest --qualifier=stable)

    # Sanity checks
    - arm-eabi-gnat --version
    - gnattest --version
    - qemu-system-arm --version

    # Build (SETUP=none: gprbuild runs directly against the anod toolchain,
    # so the qemu crate's community `gnat_arm_elf` dependency is not fetched)
    - make build-target

    # Boot the firmware first: it is the only exercise of the target HAL, and it
    # fails faster and more legibly than the harness if the image cannot boot.
    - make smoke-target

    # Cross-build and run the on-target harness
    - make build-tests-target
    - make test-target

  artifacts:
    when: always #  Upload on errors too
    paths:
      # The UART captures. Bare-metal firmware has no exit status, so on failure
      # these logs are the only evidence of what the guest did.
      - obj/target/*.log
      - obj/target/*.log.other

community:x86_64-linux:
  stage: build
  extends:
     - .x86_64-linux-community
     - .default_rules
  script:
    # Setup
    - make setup-community

    # Sanity check
    - qemu-system-arm --version

    # Build
    - make build-native

    # Test with coverage
    - make coverage-rts
    - make coverage-instrumentation
    - make coverage-build
    - make coverage-test
    - make coverage-report-cobertura
    - make coverage-report-text

    # Target build and test
    - make build-target
    - make smoke-target
    - make build-tests-target
    - make test-target

  artifacts:
    when: always #  Upload on errors too
    paths:
      # Upload the entire reports/ directory as an artifact
      - reports/
      # The UART captures. Bare-metal firmware has no exit status, so on failure
      # these logs are the only evidence of what the guest did.
      - obj/target/*.log
      - obj/target/*.log.other
