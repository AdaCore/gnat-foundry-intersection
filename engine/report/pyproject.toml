[project]
name = "vreport"
version = "0.1.0"
description = "Verification-report generator: collects gnatprove/gnatcov/requirements evidence and renders a Sphinx/MyST trust report."
readme = "README.md"
license = "Apache-2.0 OR CC-BY-4.0"
authors = [
    { name = "Rowan Walshe", email = "walshe@adacore.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "pydantic>=2.13.4",
    "sphinx>=8.1",
    "myst-parser>=4",
    "furo>=2024.8",
    "rst2pdf>=0.102",
]

[project.scripts]
vreport = "vreport.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vreport --cov-report=term-missing"
filterwarnings = [
    # rst2pdf's internals still use deprecated docutils APIs; not ours to fix.
    "ignore:nodes.Node.traverse:DeprecationWarning",
    "ignore:nodes.Text:DeprecationWarning",
]

[tool.coverage.run]
source = ["vreport"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",     # pycodestyle
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "INT",   # flake8-gettext
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "FIX",   # flake8-fixme
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "RUF",   # ruff
]

ignore = [
    "COM812",  # Recommended by ruff as it can conflict with the formatter
    "D100",    # public-module
    "D104",    # public-package
    "D105",    # magic-method
    "D106",    # public-nested-class
    "D107",    # public-init
    "D202",    # no-blank-line-after-function
    "D203",    # one-blank-line-before-class
    "D212",    # multi-line-summary-first-line
    "PLC1901", # compare-to-empty-string
    "FIX002",  # line-contains-todo - todos are ok if marked with a ticket number (TD003)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow asserts
    "S603",    # Tests drive git via subprocess with fixed arguments
    "S607",    # ... resolved from PATH
    "PLR2004", # Allow magic value comparison (e.g. `assert len(x) == 3`)
    "PLR0915", # Allow more than 50 statements (for long tests with lots of asserts)
    "TRY003",  # Allow long messages outside of exception class (for mock exceptions)
]
"src/vreport/cli.py" = [
    "FBT001",  # Boolean flags are how Typer declares CLI options
    "FBT002",  # ... and their defaults are part of that declaration
    "FBT003",  # typer.Option(False, ...) passes the default positionally by design
    "PLR0913", # A CLI command's options are its signature
    "PLR0917", # ... and Typer passes them positionally
]
"src/vreport/gnatcov.py" = [
    "S314", # xml.etree parses locally-generated gnatcov output, not untrusted input
]
"src/vreport/provenance.py" = [
    "S603", # subprocess runs git with fixed arguments for provenance
    "S607", # git is resolved from PATH by design
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["typer.Typer.command"]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src"]
plugins = "pydantic.mypy"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
strict_equality = true
