[project]
name = "reqs"
version = "0.1.0"
description = "Requirements tooling: schema validation, EARS linting, traceability, and reporting for the requirement YAML files."
readme = "README.md"
authors = [
    { name = "M. Anthony Aiello", email = "aiello@adacore.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
reqs = "reqs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6",
    "types-jsonschema>=4.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reqs --cov-report=term-missing"

[tool.coverage.run]
source = ["reqs"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",     # pycodestyle
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "INT",   # flake8-gettext
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "FIX",   # flake8-fixme
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "RUF",   # ruff
]

ignore = [
    "COM812",  # Recommended by ruff as it can conflict with the formatter
    "D100",    # public-module
    "D101",    # public-class
    "D102",    # public-method
    "D103",    # public-function
    "D104",    # public-package
    "D105",    # magic-method
    "D106",    # public-nested-class
    "D107",    # public-init
    "D202",    # no-blank-line-after-function
    "D203",    # one-blank-line-before-class
    "D212",    # multi-line-summary-first-line
    "PLC1901", # compare-to-empty-string
    "FIX002",  # line-contains-todo - todos are ok if marked with a ticket number (TD003)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow asserts
    "PLR2004", # Allow magic value comparison (e.g. `assert len(x) == 3`)
    "PLR0915", # Allow more than 50 statements (for long tests with lots of asserts)
    "TRY003",  # Allow long messages outside of exception class (for mock exceptions)
]
"src/reqs/cli.py" = [
    "FBT001", # Boolean flags are how Typer declares CLI options
    "FBT002", # ... and their defaults are part of that declaration
    "FBT003", # typer.Option(False, ...) passes the default positionally by design
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
