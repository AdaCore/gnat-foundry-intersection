description:
  1:
    text: |-
      If the result of the exponentiation overflows and checks are enabled, then the
      exponentiation function shall raise a `Constraint_Error`.
    derived: true

  2:
    text: |-
      If the result of the exponentiation overflows and checks are disabled, then the
      exponentiation function shall silently wrap around.
    derived: true

rationale: |-
  If there is a `pragma Suppress (Overflow_Check)` surrounding the use of
  exponentiation or if the application is compiled with `-gnatp`, the compiler
  will extend a call to the function without overflow checks. Otherwise, a call
  to the function with overflow checks is made.
  If the result overflows and checks are disabled, the function will wrap
  silently.
