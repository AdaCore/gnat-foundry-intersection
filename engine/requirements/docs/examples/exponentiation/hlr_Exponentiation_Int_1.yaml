context: |-
  Given `Int` a specific integer type.

description:
  1:
    text: |-
      The RTL shall provide an implementation of the `"**"` highest precedence
      exponentiation operator following the specification:

      ```ada
      function "**"(Left : Int; Right : Natural) return Int
      ```
    source:
      - ADA2022-ARM 4.5.6(7)
      - ADA2022-ARM 4.5.6(8)
      - ADA2022-ARM 4.5.6(11/3)

  2:
    text: |-
      When `Right` is strictly positive, the result of `Left**Right` shall be equal
      to `Left` multiplied by itself `Right - 1` times.
    source:
      - ADA2022-ARM 4.5.6(7)
      - ADA2022-ARM 4.5.6(8)
      - ADA2022-ARM 4.5.6(11/3)

  3:
    text: |-
      When `Right` is equal to 0, the result of `Left**Right` shall be equal to 1.
    source:
      - ADA2022-ARM 4.5.6(7)
      - ADA2022-ARM 4.5.6(8)
      - ADA2022-ARM 4.5.6(11/3)
