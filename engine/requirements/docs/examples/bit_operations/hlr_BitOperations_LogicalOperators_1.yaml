context: |-
  Given type `T` is a one-dimensional packed array whose component type is boolean.

description:
  1:
    text: |-
      The RTL shall provide an implementation of the following logical operators on
      every array of type T:

      | Function | Description |
      | --- | --- |
      | `function "and"(Left, Right : T) return T` | Performs the conventional operation of conjunction |
      | `function "or"(Left, Right : T) return T` | Performs the conventional operation of inclusive disjunction |
      | `function "xor"(Left, Right : T) return T` | Performs the conventional operation of exclusive disjunction |
    source:
      - ADA2022-ARM 4.5.1(2)
      - ADA2022-ARM 4.5.1(3)
      - ADA2022-ARM 4.5.1(4)
      - ADA2022-ARM 4.5.1(6)
      - ADA2022-ARM 4.5.1(8)

  2:
    text: |-
      The RTL implementation of the **and**, **or** and **xor** logical operators
      shall perform a component-by-component operation on every boolean constituting
      both arrays.
    source:
      - ADA2022-ARM 4.5.1(2)
      - ADA2022-ARM 4.5.1(3)
      - ADA2022-ARM 4.5.1(4)
      - ADA2022-ARM 4.5.1(6)
      - ADA2022-ARM 4.5.1(8)

  3:
    text: |-
      When the Left and Right arrays have no components, the RTL implementation of
      the **and**, **or** and **xor** logical operators shall return an empty array.
    source:
      - ADA2022-ARM 4.5.1(2)
      - ADA2022-ARM 4.5.1(3)
      - ADA2022-ARM 4.5.1(4)
      - ADA2022-ARM 4.5.1(6)
      - ADA2022-ARM 4.5.1(8)

  4:
    text: |-
      If the operands of **and**, **or**, or **xor** have unequal lengths, then the
      RTL implementation of the operator shall raise a Constraint_Error.
    source:
      - ADA2022-ARM 4.5.1(2)
      - ADA2022-ARM 4.5.1(3)
      - ADA2022-ARM 4.5.1(4)
      - ADA2022-ARM 4.5.1(6)
      - ADA2022-ARM 4.5.1(8)
