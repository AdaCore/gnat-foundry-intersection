name = "ada_tracer"
description = "Libadalang-based extractor: Ada packages/subprograms/doc -> JSON"
version = "0.1.0-dev"
authors = ["AdaCore"]
maintainers = ["AdaCore <support@adacore.com>"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["ada", "libadalang", "static-analysis", "json", "tooling"]

# Deliberately *not* pinned to the root `traffic_light` crate: the tool is
# app-agnostic and takes the project to analyse on the command line. See
# README.md.
executables = ["ada_tracer"]
project-files = ["ada_tracer.gpr"]

[[depends-on]]
# `libadalang < 26` do not declare their incompatibility with `gnat >= 16`, so
# some solutions would fail to build.
libadalang = ">=26"
# Host-only; don't fall back to the cross-compiler when the default is incompatible.
gnat_native = "*"
