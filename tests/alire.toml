name = "traffic_light_tests"
description = "Unit tests for the traffic_light crate (AUnit harness via gnattest)"
version = "0.0.0"
authors = ["Mark"]
maintainers = ["Mark <mark@example.invalid>"]
maintainers-logins = ["mark"]
licenses = "Apache-2.0 WITH LLVM-exception"

project-files = ["tests.gpr"]

[[depends-on]]
traffic_light = "*"

[[depends-on]]
aunit = "*"
gnattest_bin = "*"

[[pins]]
traffic_light = { path = '..' }

# Build `traffic_light` in the `development` profile (dependencies default to
# `release`).
[build-profiles]
traffic_light = "development"
