context: |-
  Refinement of the controller frame onto Controller
  (design/low-level-design.md §5): the composite state record, the power-on
  state, the Moore output projection with its safety postcondition, and the
  discrete-event step engine. The per-machine behavior is refined in the child
  files — llr_4_controller_1_vehicle (the phase sequencer),
  llr_4_controller_2_left_demand, and llr_4_controller_3_pedestrian.

  The frame realizes the supervisory machine of hlr_1_modes and the
  discrete-event timing model: the vehicle sequencer and each pedestrian
  service in its SERVING superstate are timed; the left-demand machines and
  the supervisor are not. One Step reports Wait, the minimum time to the next
  timed transition, and leaves the composite state as of the end of that
  delay; the core loop (llr_5_core_loop) sleeps Wait and steps again.

  The mode frame pre-empts every sub-machine: the machine HLRs drop the
  NORMAL_OPERATION guard and rely on it, so in FAULT the controller emits the
  fault outputs and does nothing else, and FAULT is terminal
  (hlr_1_modes.3/.4).

implemented_by:
  - Controller.Controller_State
  - Controller.Pedestrian_Timers
  - Controller.Initialize
  - Controller.Project_Outputs
  - Controller.Step
  - Controller.Fault_Dwell

preconditions:
  - The core loop calls Initialize exactly once, before the first Step.
  - The core loop calls Step once per iteration, passing the sensor snapshot
    just read from the source bus, writing Outputs to the display bus
    immediately after, and delaying Wait logical milliseconds before the next
    call (llr_5_core_loop).

description:
  # ---- the composite state ----
  1: |-                                  # -> hlr_1_modes.1, hlr_5_vehicle.1, hlr_5_vehicle_1_left_demand.1, hlr_6_pedestrian.1   impl: Controller.Controller_State
    The Controller package shall define the record type Controller_State
    holding the whole controller state: the Mode, the Vehicle_Sequencer_State
    with its remaining-time field Veh_Timer and latched lag decision Veh_Lag,
    the Left_Demand_Array, and the Pedestrian_Array with its per-crosswalk
    remaining-time array Ped_Timer.

  # ---- power-on state ----
  2: |-                                  # -> hlr_1_modes.2   impl: Controller.Initialize
    When Initialize is called, the controller shall set State.Mode to
    NORMAL_OPERATION.
  3: |-                                  # -> hlr_5_vehicle.47   impl: Controller.Initialize
    When Initialize is called, the controller shall set State.Vehicle to
    EW_BARRIER_ALLRED and State.Veh_Timer to T_BARRIER.
  4: |-                                  # -> hlr_5_vehicle_1_left_demand.2   impl: Controller.Initialize
    When Initialize is called, the controller shall set State.Left to
    NO_LEFT_DEMAND for every approach.
  5: |-                                  # -> hlr_6_pedestrian.2   impl: Controller.Initialize
    When Initialize is called, the controller shall set State.Ped to
    NO_PEDESTRIAN_REQUEST, and State.Ped_Timer to 0, for every crosswalk.

  # ---- output projection ----
  6: |-                                  # -> hlr_2_fault.1   impl: Controller.Project_Outputs
    While State.Mode is FAULT, Project_Outputs shall return FLASHING_RED for
    every through face and every left face.
  7: |-                                  # -> hlr_2_fault.2   impl: Controller.Project_Outputs
    While State.Mode is FAULT, Project_Outputs shall return NONE for every
    crosswalk's pedestrian head.
  8: |-                                  # -> hlr_2_fault.3   impl: Controller.Project_Outputs
    While State.Mode is FAULT, Project_Outputs shall return NO_REQUEST for
    every crosswalk's request indicator.
  9: |-                                  # -> hlr_4_signals.1   impl: Controller.Project_Outputs
    While State.Mode is NORMAL_OPERATION, Project_Outputs shall return the
    through and left faces of Vehicle_Face_Outputs (State.Vehicle)
    (llr_4_controller_1_vehicle).
  10: |-                                 # -> hlr_4_signals.2   impl: Controller.Project_Outputs
    While State.Mode is NORMAL_OPERATION, Project_Outputs shall return, for
    each crosswalk, the pedestrian head Head_Of (State.Ped (C))
    (llr_4_controller_3_pedestrian).
  11: |-                                 # -> hlr_4_signals.3   impl: Controller.Project_Outputs
    While State.Mode is NORMAL_OPERATION, Project_Outputs shall return, for
    each crosswalk, the request indicator Request_Of (State.Ped (C))
    (llr_4_controller_3_pedestrian).
  12: |-                                 # -> hlr_0_safety.2   impl: Controller.Project_Outputs
    The Project_Outputs function shall carry the postcondition
    Conflicts.Safe_Faces (Project_Outputs'Result).

  # ---- Step: fault pre-emption ----
  13: |-                                 # -> hlr_1_modes.3   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, when Step is called with
    Sensors.Fault ASSERTED, the controller shall set State.Mode to FAULT.
  14: |-                                 # -> hlr_1_modes.4   impl: Controller.Step
    While State.Mode is FAULT, Step shall set Outputs to
    Project_Outputs (State).
  15: |-                                 # -> hlr_1_modes.4   impl: Controller.Step
    While State.Mode is FAULT, Step shall set Wait to FAULT_DWELL and return
    without arming, advancing, or deriving edges for any NORMAL_OPERATION
    sub-machine.

  # ---- Step: emit, wait, advance ----
  16: |-                                 # -> hlr_4_signals.1, .2, .3   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, Step shall set Outputs to
    Project_Outputs (State) evaluated after the input arming of this step
    (llr_4_controller_2_left_demand.1, llr_4_controller_3_pedestrian.10-.11)
    and before any timer advances.
  17: |-                                 # -> hlr_3_timing.11   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, Step shall set Wait to the minimum
    of State.Veh_Timer and every State.Ped_Timer (C) whose crosswalk is in a
    Serving_Pedestrian_State.
  18: |-                                 # -> hlr_3_timing.11   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, Step shall advance every running
    timer by Wait — firing the timed transition (Advance_Vehicle, Advance_Ped)
    of each timer whose remaining time is no more than Wait, and decrementing
    each other running timer by Wait.
  19: |-                                 # -> hlr_5_vehicle_1_left_demand.4   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, Step shall apply the demand-clear
    edge (llr_4_controller_2_left_demand.3) keyed on the through faces that
    are GREEN in the sequencer state after this step's advance and were not
    GREEN in the sequencer state before it.
  20: |-                                 # -> hlr_6_pedestrian.8   impl: Controller.Step
    While State.Mode is NORMAL_OPERATION, Step shall apply the
    pedestrian-service edge (llr_4_controller_3_pedestrian.12) keyed on the
    through faces that are GREEN in the sequencer state after this step's
    advance and were not GREEN in the sequencer state before it.
  21: |-                                 # -> hlr_0_safety.2   impl: Controller.Step
    The Step procedure shall carry the postcondition
    Conflicts.Safe_Faces (Outputs).

algorithm_aspects: |-
  Wait is well-defined because State.Veh_Timer always runs in
  NORMAL_OPERATION (the sequencer has no untimed state); a Ped_Timer runs
  exactly while its crosswalk is in the SERVING superstate. Firing "no more
  than Wait" rather than "equal to Wait" is the same thing (Wait is the
  minimum) written so the subtraction provably cannot underflow: the
  decrement branch runs only on strictly larger timers.

  Emitting after arming (16) is what lights a request lamp in the same step
  as the press that raised it (hlr_6_pedestrian.7): the lamp output is a
  Moore function of the post-arm state. Emitting before advancing keeps the
  outputs those of the state whose dwell the loop is about to sleep — the
  discrete-event contract. The edge derivation (19, 20) runs after the
  advance, off the same step's sequencer transition, so a service or clear
  lands on the very step its triggering GREEN onset occurs and is emitted
  together with it on the next write.

  FAULT_DWELL (1_000 ms) is pacing only: FAULT has no timed transitions, so
  the value affects nothing but the loop's wake-up cadence in FAULT.

rationale: |-
  hlr_0_safety.1 is deliberately not a runtime contract here — unlike the
  vehicle-conflict invariant (statements 12, 21), it is a property of the
  whole schedule, discharged as the static margin (llr_1_states.27/.28,
  design/proof.md).
