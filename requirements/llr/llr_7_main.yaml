context: |-
  Refinement of the application composition onto Main
  (design/low-level-design.md §8) — the one place the four projects meet. Main
  wires the buses to the HAL (which producer feeds the input signals, which
  consumer renders the output signals), instantiates the core loop, initializes
  the display, and runs the loop. All wiring is local; nothing is global.

description:
  1:
    text: |-
      The Main procedure shall instantiate Buses.Source_Bus with
      Sources.Sample as its producer, binding every input signal to the HAL
      sources.
    parent_req:
      - hlr_4_signals.4
      - hlr_4_signals.5
      - hlr_4_signals.6
    implemented_by:
      - Main
    # verified_by:
    #   - means: test
    #     by: "PLACEHOLDER (#17): system-level. Generic instantiation is
    #       compile-checked for the formal *profile*, not for the identity of
    #       the actual -- `new Buses.Source_Bus (Producer => Sources.Sample)`
    #       compiles just as happily with any other matching procedure -- so
    #       no witness in the unit under test can establish this. What the
    #       statement is really about is behavioural (every input signal
    #       reaches the controller from the HAL sources), and that is
    #       observable end to end once the system-level tests exist.
    #       Currently unverified."

  2:
    text: |-
      The Main procedure shall instantiate Buses.Display_Bus with Display.Show
      as its consumer, binding every output signal to the HAL display.
    parent_req:
      - hlr_4_signals.1
      - hlr_4_signals.2
      - hlr_4_signals.3
    implemented_by:
      - Main
    # verified_by:
    #   - means: test
    #     by: "PLACEHOLDER (#17): system-level, for the reason given under
    #       statement 1. Currently unverified."

  3:
    text: |-
      The Main procedure shall instantiate State_Machine_Loop with
      Timings.Delay_For, the source bus's Bus_Read, and the display bus's
      Bus_Write.
    parent_req:
      - hlr_1_modes.2
    implemented_by:
      - Main
    # verified_by:
    #   - means: test
    #     by: "PLACEHOLDER (#17): system-level, for the reason given under
    #       statement 1. Currently unverified."

  4:
    text: |-
      When the controller starts up, the Main procedure shall call
      Display.Initialize.
    parent_req:
      - hlr_1_modes.2
    implemented_by:
      - Main

  5:
    text: |-
      When Display.Initialize has returned, the Main procedure shall run
      State_Machine_Loop.
    parent_req:
      - hlr_1_modes.2
    implemented_by:
      - Main
