parent_req:
  - hlr_4_signals.1
  - hlr_4_signals.2
  - hlr_4_signals.3
  - hlr_4_signals.4
  - hlr_4_signals.5
  - hlr_4_signals.6

context: |-
  Refinement of the controller's I/O boundary onto the generic buses
  Source_Bus and Display_Bus (design/low-level-design.md §3): how the
  hlr_4_signals input signals reach the core (one Sensors_State snapshot) and
  the output signals leave it (one Display_State write). Each bus carries one
  whole aggregate per call, so a composite state crosses atomically. Input
  coalescing is not a bus function; it is realized by the controller's
  level-triggered arming (llr_4_controller_2_left_demand,
  llr_4_controller_3_pedestrian). Debounce, electrical sensing, and rendering
  are HAL concerns across the boundary, not specified here.

implemented_by:
  - Buses.Source_Bus.Bus_Read
  - Buses.Display_Bus.Bus_Write

description:
  1: |-                                  # -> hlr_4_signals.4, .5, .6   impl: Buses.Source_Bus.Bus_Read
    When Bus_Read is called, the source bus shall obtain the whole
    Sensors_State snapshot — every input-signal value at once — by invoking
    its generic producer Bus_Write.
  2: |-                                  # -> hlr_4_signals.4, .5, .6   impl: Buses.Source_Bus.Bus_Read
    The source bus shall hold no state between reads.
  3: |-                                  # -> hlr_4_signals.1, .2, .3   impl: Buses.Display_Bus.Bus_Write
    When Bus_Write is called, the display bus shall deliver the Display_State
    value to its generic consumer Bus_Read before returning.
