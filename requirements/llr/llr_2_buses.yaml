context: |-
  Refinement of the controller's I/O boundary onto the generic buses
  Source_Bus and Display_Bus (design/architecture.md §Buses): how the
  hlr_4_signals input signals reach the core (one Sensors_State snapshot) and
  the output signals leave it (one Display_State write). Each bus carries one
  whole aggregate per call, so a composite state crosses atomically.

  In this synchronous revision the source bus holds no state between reads:
  each Bus_Read samples every input afresh through its producer and reports
  that instantaneous level (llr_2_buses.2, .3), so a momentary event present
  only between two reads is not observed. The coalescing that does apply is the
  controller's level-triggered arming, which folds a demand held active across
  successive reads into one PENDING request (llr_4_controller_2_left_demand,
  llr_4_controller_3_pedestrian) — the input coalescing the bus does not itself
  provide. A future asynchronous revision will add a coalescing latch as bus
  instance state, cleared on read so momentary events survive; at that point
  statements 2 and 3 tighten to "since the previous Bus_Read" semantics. That
  latch is deliberately not required here (design/architecture.md §Buses).
  Debounce, electrical sensing, and rendering are HAL concerns across the
  boundary, not specified here.

description:
  1:
    text: |-
      When Bus_Read is called, the source bus shall obtain the whole
      Sensors_State snapshot — every input-signal value at once — by invoking
      its generic producer Bus_Write.
    parent_req:
      - hlr_4_signals.4
      - hlr_4_signals.5
      - hlr_4_signals.6
    implemented_by:
      - Buses.Source_Bus.Bus_Read

  2:
    text: |-
      When Bus_Read is called, the source bus shall report each input signal
      with the value sampled from its producer during that call — the signal's
      level at that call: a button as PRESSED or RELEASED, a left-turn detector
      as VEHICLE_PRESENT or NO_VEHICLE, and the fault line as ASSERTED or
      NOT_ASSERTED.
    parent_req:
      - hlr_4_signals.4
      - hlr_4_signals.5
      - hlr_4_signals.6
    implemented_by:
      - Buses.Source_Bus.Bus_Read

  3:
    text: |-
      When Bus_Read is called, the source bus shall retain no value from that
      call to the next, so each Bus_Read reports only the levels sampled during
      it, independent of any earlier Bus_Read.
    parent_req:
      - hlr_4_signals.4
      - hlr_4_signals.5
      - hlr_4_signals.6
    implemented_by:
      - Buses.Source_Bus.Bus_Read

  4:
    text: |-
      When Bus_Write is called, the display bus shall deliver the Display_State
      value to its generic consumer Bus_Read before returning.
    parent_req:
      - hlr_4_signals.1
      - hlr_4_signals.2
      - hlr_4_signals.3
    implemented_by:
      - Buses.Display_Bus.Bus_Write
