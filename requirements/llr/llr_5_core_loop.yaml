context: |-
  Refinement of the controller's driving cycle onto State_Machine_Loop
  (design/architecture.md §"The core loop"): the generic loop that fires every
  HLR trigger by moving input signals in (Read_Sources), output signals out
  (Write_Display), and time forward (Delay_For of the fixed sampling period
  T_SAMPLE every iteration). It is
  generic over exactly those three procedures, so the core never names a HAL
  unit (wiring in llr_7_main), and it owns the Controller_State locally, so
  the composite state exists nowhere else. The proof-only harness
  State_Machine_Loop_Proof carries no requirements.

description:
  1:
    text: |-
      When the core loop starts, State_Machine_Loop shall call
      Controller.Initialize on its local Controller_State exactly once, before
      the first iteration.
    parent_req:
      - hlr_1_modes.2
    implemented_by:
      - State_Machine_Loop

  2:
    text: |-
      While running, State_Machine_Loop shall perform each iteration as, in
      order: Read_Sources into the sensor snapshot, Controller.Step on the
      state with that snapshot, Write_Display of the outputs Step produced,
      and Delay_For of the sampling period T_SAMPLE (llr_1_states.30).
    parent_req:
      - hlr_4_signals.1
      - hlr_4_signals.2
      - hlr_4_signals.3
      - hlr_4_signals.4
      - hlr_4_signals.5
      - hlr_4_signals.6
    implemented_by:
      - State_Machine_Loop

  3:
    text: |-
      The State_Machine_Loop procedure shall iterate indefinitely (No_Return),
      with no termination path.
    parent_req:
      - hlr_1_modes.4
      - hlr_3_timing.11
    implemented_by:
      - State_Machine_Loop

  4:
    text: |-
      While running, State_Machine_Loop shall perform Read_Sources at least
      once every T_SAMPLE logical milliseconds (llr_1_states.30).
    parent_req:
      - hlr_3_timing.13
    implemented_by:
      - State_Machine_Loop

algorithm_aspects: |-
  The four-stage order realizes the fixed-cadence sampled contract
  (llr_4_controller): each Step accounts for exactly one sampling period of
  logical time on the timers held in the loop's Controller_State
  (llr_4_controller.17/.18), Write_Display publishes the outputs it emits,
  and Delay_For sleeps exactly T_SAMPLE. The loop therefore wakes on every
  sampling boundary — and because every dwell valuation is a multiple of
  T_SAMPLE (llr_1_states.31), every timed transition's boundary is a sampling
  boundary, so boundary iterations advance the machines exactly on their
  dwell and the controller's timing (hlr_3_timing) stays real on the target,
  while the intervening sampling iterations re-read the inputs and re-emit
  the unchanged Moore outputs. The fixed cadence satisfies statement 4 by
  construction — Read_Sources runs exactly once per T_SAMPLE on every path
  and in both modes — and the loop still carries no clock and no second code
  path: the cadence is the single constant it passes to Delay_For. The
  accuracy of the sleep itself is the HAL contract (llr_6_hal.1).

rationale: |-
  Statement 3's No_Return discharges "remain in FAULT" (hlr_1_modes.4) too:
  FAULT is a driven state — the loop keeps ticking and re-emitting the fault
  outputs — not a halt.

  Statement 4 refines the acknowledgment bound hlr_3_timing.13 (T_ACK =
  0.2 s): a press landing between reads is captured by the source-bus latch
  (llr_2_buses.2), the next Read_Sources — at most T_SAMPLE later — delivers
  it, the same iteration's Step arms it into the pedestrian machine
  (llr_4_controller_3_pedestrian.10/.11), and the same iteration's
  Write_Display carries the REQUEST_PENDING indicator (statement 2). Press to
  indicator is thus bounded by one sampling period plus one iteration's
  processing and rendering, which the factor-of-two budget in T_SAMPLE's
  valuation absorbs (llr_1_states.30).

  The durable record of the coalesced inputs kept in the main loop is the
  loop's local Controller_State itself: arming latches a seen press as
  PENDING_PEDESTRIAN_REQUEST or BUFFER_INTERVAL_LATCHED, so no separate
  loop-side input record exists. Inter-read coalescing stays in the source
  bus (llr_2_buses.2/.3); across-read coalescing stays in the controller's
  level-triggered, state-guarded arming.
