  19: |-                                 # -> hlr_5_vehicle.29   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is E_DROP_YELLOW, Vehicle_Face_Outputs shall return
    YELLOW for the EAST through face and GREEN for the WEST through face, and
    RED for every other vehicle face.
  20: |-                                 # -> hlr_5_vehicle.30   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is E_DROP_CLEAR, Vehicle_Face_Outputs shall return
    GREEN for the WEST through face, and RED for every other vehicle face.
  21: |-                                 # -> hlr_5_vehicle.31   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is W_LAG, Vehicle_Face_Outputs shall return GREEN for
    the WEST through face and GREEN for the WEST left face, and RED for every
