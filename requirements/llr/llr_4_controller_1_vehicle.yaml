algorithm_aspects: |-
  The output table is written as explicit literal aggregates per state — not
  a DRY axis-parameterized helper — so the Safe_Faces postcondition
  (llr_4_controller.10) is a check over literal constants in every state; the
  duplication between the NS rows and their EW mirror is the price of that
  structure.

  Latching the lag decision at both-through entry rather than reading demand
  at exit serves two constraints at once: the residual dwell must be
  computable at entry (the slot arithmetic of Both_Duration needs to know
  whether the lag's overhead runs), and the demand snapshot used for the time
  budget must be the same one that later routes the exit (30/31, 44/45) — a
  vehicle arriving mid-both-through therefore waits for the next cycle, which
  the fixed-slot policy (hlr_3_timing.7) requires anyway.

  Fixed_Duration (the per-state dwell table the transitions reload from) maps
  the both-through states to T_BOTH_MIN purely for totality; that value is
  never consulted for them — their dwell always comes from Both_Duration.

  The Both_Duration formula keeps T_AXIS demand-independent (hlr_3_timing.7):
  the axis slot spans barrier + optional lead block + both-through + exit
  block, and the residual shrinks by exactly the overhead of whichever
  optional blocks run. The no-lag branch still subtracts one T_YELLOW — the
  both-drop yellow that ends the slot in that case.
