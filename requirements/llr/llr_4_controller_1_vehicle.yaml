algorithm_aspects: |-
  The output table is written as explicit literal aggregates per state — not a
  DRY axis-parameterized helper — so the Safe_Faces postcondition
  (llr_4_controller.10) is a check over literal constants in every state; the
  HOLD rows (7, 18) repeat their parent both-through row (6, 17), and the
  duplication between the NS rows and their EW mirror is the price of that
  structure.

  Both_Duration sizes the commit interval assuming the lag will run — the
  smallest both-through interval, and the worst case the T_BOTH_MIN floor
  (hlr_3_timing.12, llr_1_states.29) is sized against. It takes only Lead_Ran:
  the lag is no longer a parameter, because the commit interval is the same
  whether or not the lag ultimately runs — the difference is absorbed after the
  commit boundary, by the lag block (30, 43) or by the HOLD interval (31, 44).
  The formula keeps T_AXIS demand-independent (hlr_3_timing.7): the axis slot is
  barrier + optional lead block + commit interval + either the lag block or the
  HOLD interval plus the both-drop yellow, and the commit interval shrinks by
  exactly the lead overhead that runs.

  The hold interval is T_REDCLEAR + T_LAG + T_YELLOW — the reserved lag block
  (T_YELLOW + T_REDCLEAR + T_LAG + T_YELLOW) less the both-drop yellow that ends
  the no-lag slot — so commit + HOLD + both-drop yellow equals commit + lag
  block, and the two exits close the slot identically at T_AXIS. It is a fixed
  per-state dwell, so Fixed_Duration carries it directly for the HOLD states,
  unlike the both-through commit states, which Fixed_Duration maps to T_BOTH_MIN
  purely for totality (their dwell always comes from Both_Duration).

  Reading the lagging demand at the commit boundary (30/31, 43/44) rather than
  latching it at both-through entry is the substantive behaviour of this LLR: a
  lagging left detected while the both-throughs run is honoured this cycle,
  provided it arrives before the commit interval elapses — the last instant at
  which a full lag block still fits the slot. A left arriving after that waits
  for the next cycle, which the fixed slot (hlr_3_timing.7) makes unavoidable,
  but the ignored window is now the tail of the phase rather than the whole of
  it. Because the decision is read live and the HOLD exit is unconditional, the
  sequencer carries no latched lag flag.
