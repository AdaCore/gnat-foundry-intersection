context: |-
  Refinement of the vehicle phase sequencer (hlr_5_vehicle) onto Controller
  (design/low-level-design.md §5.3-§5.4): the Moore output table
  Vehicle_Face_Outputs, the transition procedure Advance_Vehicle, and the
  both-through residual Both_Duration. The frame that drives them — the step
  engine, the power-on entry (hlr_5_vehicle.47), the fault pre-emption — is
  llr_4_controller.

  The sequencer state is Vehicle with its dwell in Veh_Timer; each transition
  both sets the new state and reloads the timer with that state's dwell, so the
  schedule rides on the (state, timer) pair. "When its dwell elapses" is
  Veh_Timer reaching zero (llr_4_controller.14-.15).

  The both-through phase is the one dwell not fixed by its state (the departure
  from strict Moore that hlr_5_vehicle flags), and it is served across two states
  so the lag decision is taken as late as it can still be honoured:

    - NS_BOTH_THROUGH / EW_BOTH_THROUGH run the *commit interval*: the axis-slot
      residual after the barrier, the lead overhead that ran, and a reserved full
      lagging-left block (Both_Duration). Its length depends on whether the lead
      ran, so it is not a pure function of state.
    - When the commit interval elapses, the lagging approach's live demand is read
      (30/31, 43/44): a pending left routes into the lag block (N_DROP_YELLOW /
      E_DROP_YELLOW); no demand routes into NS_BOTH_THROUGH_HOLD /
      EW_BOTH_THROUGH_HOLD, which run the fixed *hold interval* — the reserved lag
      block less its closing yellow — before the both-drop yellow.

  Reading demand at the commit boundary rather than at both-through entry means a
  lagging left arriving any time during the commit interval is served this cycle.
  Both branches close the slot at exactly T_AXIS, so T_AXIS stays
  demand-independent (hlr_3_timing.7). There is no latched lag flag: the exit
  reads State.Left directly.

description:
  # ---- structural discipline ----
  1:
    text: |-
      The vehicle sequencer shall assign State.Vehicle only in Advance_Vehicle,
      whose case structure admits exactly the transitions of statements 25-50.
    parent_req:
      - hlr_5_vehicle.1
      - hlr_5_vehicle.24
    verification:
      - method: proof
    implemented_by:
      - Controller.Advance_Vehicle

  2:
    text: |-
      While State.Mode is NORMAL_OPERATION, the vehicle sequencer shall change
      State.Vehicle only when the current state's dwell has elapsed
      (State.Veh_Timer reaching zero), never on absence of vehicular demand.
    parent_req:
      - hlr_3_timing.11
    verification:
      - method: proof
    implemented_by:
      - Controller.Advance_Vehicle

  # ---- Moore output rows, NS axis (all unlisted faces RED) ----
  3:
    text: |-
      While State.Vehicle is N_LEAD, Vehicle_Face_Outputs shall return GREEN
      for the NORTH through face and GREEN for the NORTH left face, and RED for
      every other vehicle face.
    parent_req:
      - hlr_5_vehicle.2
    verification: test
    implemented_by:
      - Controller.Vehicle_Face_Outputs

  4:
    text: |-
      While State.Vehicle is N_LEAD_YELLOW, Vehicle_Face_Outputs shall return
      GREEN for the NORTH through face and YELLOW for the NORTH left face, and
      RED for every other vehicle face.
    parent_req:
      - hlr_5_vehicle.3
    verification: test
    implemented_by:
      - Controller.Vehicle_Face_Outputs

  5:
