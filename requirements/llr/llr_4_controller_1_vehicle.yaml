      While State.Vehicle is NS_BOTH_THROUGH, Vehicle_Face_Outputs shall return
      GREEN for the NORTH and SOUTH through faces, and RED for every other
      vehicle face.
    parent_req:
      - hlr_5_vehicle.5
    verification: test
    implemented_by:
      - Controller.Vehicle_Face_Outputs

  7:
    text: |-
      While State.Vehicle is NS_BOTH_THROUGH_HOLD, Vehicle_Face_Outputs shall
      return GREEN for the NORTH and SOUTH through faces, and RED for every other
      vehicle face (the same row as NS_BOTH_THROUGH: the hold continues the
      both-through phase).
    parent_req:
      - hlr_5_vehicle.48
    verification: test
    implemented_by:
      - Controller.Vehicle_Face_Outputs

  8:
