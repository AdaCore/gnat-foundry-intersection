    While State.Vehicle is EW_BOTH_DROP_YELLOW, Vehicle_Face_Outputs shall
    return YELLOW for the EAST and WEST through faces, and RED for every
    other vehicle face.
  24: |-                                 # -> hlr_5_vehicle.34   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is EW_BARRIER_ALLRED, Vehicle_Face_Outputs shall
    return RED for every vehicle face.

  # ---- transitions, NS axis ----
  25: |-                                 # -> hlr_5_vehicle.12   impl: Controller.Advance_Vehicle
    While State.Vehicle is EW_BARRIER_ALLRED and State.Left (NORTH) is
    LEFT_DEMAND_PENDING, when its dwell (T_BARRIER) elapses, Advance_Vehicle
    shall set State.Vehicle to N_LEAD and State.Veh_Timer to T_LEAD.
  26: |-                                 # -> hlr_5_vehicle.13, hlr_3_timing.7, .8   impl: Controller.Advance_Vehicle, Controller.Both_Duration
    While State.Vehicle is EW_BARRIER_ALLRED and State.Left (NORTH) is
    NO_LEFT_DEMAND, when its dwell (T_BARRIER) elapses, Advance_Vehicle shall
    set State.Vehicle to NS_BOTH_THROUGH and set State.Veh_Timer to the
    both-through commit interval
    T_AXIS - T_BARRIER - (T_YELLOW + T_REDCLEAR + T_LAG + T_YELLOW).
  27: |-                                 # -> hlr_5_vehicle.14   impl: Controller.Advance_Vehicle
    While State.Vehicle is N_LEAD, when its dwell (T_LEAD) elapses,
    Advance_Vehicle shall set State.Vehicle to N_LEAD_YELLOW and
    State.Veh_Timer to T_YELLOW.
  28: |-                                 # -> hlr_5_vehicle.15   impl: Controller.Advance_Vehicle
    While State.Vehicle is N_LEAD_YELLOW, when its dwell (T_YELLOW) elapses,
