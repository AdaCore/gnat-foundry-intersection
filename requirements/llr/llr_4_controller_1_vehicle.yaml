    State.Veh_Timer to T_REDCLEAR.
  29: |-                                 # -> hlr_5_vehicle.16, hlr_3_timing.7, .8   impl: Controller.Advance_Vehicle, Controller.Both_Duration
    While State.Vehicle is N_LEAD_CLEAR, when its dwell (T_REDCLEAR) elapses,
    Advance_Vehicle shall set State.Vehicle to NS_BOTH_THROUGH and set
    State.Veh_Timer to the both-through commit interval
    T_AXIS - T_BARRIER - (T_LEAD + T_YELLOW + T_REDCLEAR)
    - (T_YELLOW + T_REDCLEAR + T_LAG + T_YELLOW).
  30: |-                                 # -> hlr_5_vehicle.17   impl: Controller.Advance_Vehicle
    While State.Vehicle is NS_BOTH_THROUGH and State.Left (SOUTH) is
    LEFT_DEMAND_PENDING, when its dwell (the both-through commit interval)
