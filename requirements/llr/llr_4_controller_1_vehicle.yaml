context: |-
  Refinement of the vehicle phase sequencer (hlr_5_vehicle) onto Controller
  (design/low-level-design.md §5.3-§5.4): the Moore output table
  Vehicle_Face_Outputs, the transition procedure Advance_Vehicle, and the
  both-through residual Both_Duration. The frame that drives them —
  the step engine, the power-on entry (hlr_5_vehicle.47), the fault
  pre-emption — is llr_4_controller.

  The sequencer state is Vehicle with its dwell in Veh_Timer; each transition
  both sets the new state and reloads the timer with that state's dwell, so
  the schedule rides on the (state, timer) pair. "When its dwell (T_X)
  elapses" is Veh_Timer reaching zero (llr_4_controller.14-.15).

  T_BOTH, the both-through dwell, is the one dwell not fixed by its state (the
  departure from strict Moore that hlr_5_vehicle flags): it is the axis-slot
  residual after the lead/lag overheads that run, decided at both-through
  entry. Each entry transition latches the lag decision (Veh_Lag) — TRUE
  exactly when the axis's lag approach has a pending left — so the both-through
  exits (30/31, 44/45) read the latched decision, not live demand.

implemented_by:
  - Controller.Vehicle_Face_Outputs
  - Controller.Through_Face
  - Controller.Advance_Vehicle
  - Controller.Both_Duration
  - Controller.Fixed_Duration

description:
  # ---- structural discipline ----
  1: |-                                  # -> hlr_5_vehicle.1, .24   impl: Controller.Advance_Vehicle
    The vehicle sequencer shall assign State.Vehicle only in Advance_Vehicle,
    whose case structure admits exactly the transitions of statements 23-50.
  2: |-                                  # -> hlr_3_timing.11   impl: Controller.Advance_Vehicle
    While State.Mode is NORMAL_OPERATION, the vehicle sequencer shall change
    State.Vehicle only when the current state's dwell has elapsed
    (State.Veh_Timer reaching zero), never on absence of vehicular demand.

  # ---- Moore output rows, NS axis (all unlisted faces RED) ----
  3: |-                                  # -> hlr_5_vehicle.2   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is N_LEAD, Vehicle_Face_Outputs shall return GREEN
    for the NORTH through face and GREEN for the NORTH left face, and RED for
    every other vehicle face.
