    State.Veh_Timer to T_YELLOW.
  31: |-                                 # -> hlr_5_vehicle.18, hlr_3_timing.7, .8   impl: Controller.Advance_Vehicle
    While State.Vehicle is NS_BOTH_THROUGH and State.Left (SOUTH) is
    NO_LEFT_DEMAND, when its dwell (the both-through commit interval) elapses,
