    While State.Vehicle is EW_BOTH_THROUGH, Vehicle_Face_Outputs shall return
    GREEN for the EAST and WEST through faces, and RED for every other
    vehicle face.
  18: |-                                 # -> hlr_5_vehicle.50   impl: Controller.Vehicle_Face_Outputs
    While State.Vehicle is EW_BOTH_THROUGH_HOLD, Vehicle_Face_Outputs shall
