context: |-
  Intersection-wide timing parameters. The pedestrian and vehicle state machines
  (`6_pedestrian`, `5_vehicle`) fix the *order* of phases and intervals; this fixes
  their *durations*. Each duration is named here once — with a fixed value where
  CONOPS or the MUTCD mandates one, and a kinematic basis where the value is
  speed-dependent — and the state machines refer to it by that name.

  Standard-fixed durations: T_WALK, T_FDW, T_BUFFER (CONOPS); T_YELLOW, T_REDCLEAR,
  T_BARRIER (MUTCD kinematic basis). Per-intersection policy durations, named here
  but valued at deployment and bounded only by the constraints below: T_AXIS,
  T_LEAD, T_LAG, T_BOTH_MIN. One further duration is not valued at all: T_BOTH, the
  both-through residual, is whatever each cycle's service slot leaves after the
  lead and lag phases it actually runs — statement 8 fixes it as the residual that
  holds T_AXIS independent of left-turn demand, so its value rises and falls with
  demand rather than being set once.

  The crosswalk coupling is discharged as the static margin in requirement 10
  rather than by the vehicle sequencer observing pedestrian state — this discharges
  the pedestrian-conflict safety invariant `0_safety.1`, and is sound only while
  through movements run their full slot (no gap-out), which requirement 11 makes a
  checkable obligation.

description:
  # ---- standard-fixed durations ----

  1:
    text: |-
      The controller shall use a WALK interval (T_WALK) of 7 seconds.
    source:
      - CONOPS §3.6

  2:
    text: |-
      The controller shall use a pedestrian change interval (T_FDW) of 7 seconds.
    source:
      - CONOPS §3.7

  3:
    text: |-
      The controller shall use a pedestrian buffer interval (T_BUFFER) of 2 seconds.
    source:
      - CONOPS §3.5

  4:
    text: |-
      The controller shall derive each movement's yellow change interval (T_YELLOW)
      from the MUTCD kinematic basis.
    source:
      - CONOPS §2.5

  5:
    text: |-
      The controller shall derive each movement's red clearance interval (T_REDCLEAR)
      from the MUTCD kinematic basis.
    source:
      - CONOPS §2.5

  6:
    text: |-
      The controller shall derive the barrier clearance interval (T_BARRIER) from the
      MUTCD kinematic basis.
    source:
      - CONOPS §2.8

  # ---- per-intersection policy, bounded not valued ----

  7:
    text: |-
      The controller shall make each axis's service slot (T_AXIS), from the start of
      that axis's service to the start of the perpendicular axis's service,
      independent of left-turn demand.
    source:
      - CONOPS §5.1

  8:
    text: |-
      The controller shall set each axis's both-through interval (T_BOTH) to the
      portion of that axis's service slot (T_AXIS) left after the leading (T_LEAD) and
      lagging (T_LAG) protected-left intervals, the yellow-change (T_YELLOW) and
      red-clearance (T_REDCLEAR) intervals, and the barrier-clearance (T_BARRIER)
      interval that actually run in that slot, so that T_AXIS is held independent of
      left-turn demand (statement 7).
    derived: true

  9:
    text: |-
      The controller shall limit each protected left-turn interval, leading (T_LEAD)
      or lagging (T_LAG), to no more than half of its axis's service slot (T_AXIS / 2).
    source:
      - CONOPS §2.10

  # ---- pedestrian conflict buffer (static margin) ----

  10:
    text: |-
      The controller shall hold the output signal of every vehicular movement that
      conflicts with a crosswalk at RED until at least T_WALK + T_FDW + T_BUFFER has
      elapsed since that crosswalk's adjacent through output signal most recently
      transitioned to GREEN.
    source:
      - CONOPS §3.4
      - CONOPS §3.5

  # ---- fixed-slot premise (margin soundness) ----

  11:
    text: |-
      The controller shall run each axis's service slot for its full scheduled
      duration (T_AXIS), ending the slot only when T_AXIS has elapsed and never on
      absence of vehicular demand.
    source:
      - CONOPS §5.1

  # ---- both-through floor (T_AXIS sizing) ----

  12:
    text: |-
      The controller shall size each axis's service slot (T_AXIS) so that the
      both-through residual (T_BOTH, statement 8) is never less than a minimum
      both-through interval (T_BOTH_MIN).
    source:
      - CONOPS §2.9

rationale: |-
  Naming each duration once gives the two state machines a single value to cite
  (WALK_INTERVAL dwells for T_WALK, the *_YELLOW states for T_YELLOW, and so on),
  so no interval value is duplicated or left floating. The standard-fixed values
  (1-6) trace to CONOPS §3.5-§3.7 and the MUTCD change-and-clearance basis; the
  policy durations (7-9, 12) are deployment knobs, constrained rather than valued
  here.

  The fixed slot (7) is what makes "cross traffic waits a fixed time" hold: a
  served left draws from the both-through residual (T_BOTH, statement 8), never from
  the slot. The floor (12) keeps the through phase from being starved when both
  lefts run, sizing T_AXIS from below.

  The buffer (10) replaces the runtime green-hold/handshake with a schedule margin:
  because every onset and release is fixed, the obligation is a static inequality.
  It is the discharge of the pedestrian-conflict invariant `0_safety.1`. Its
  `T_WALK + T_FDW + T_BUFFER` window is exactly the SERVING_PEDESTRIAN_REQUEST dwell:
  `6_pedestrian` folds the §3.5 clearance buffer into that superstate, so the
  invariant's "while in SERVING" window and this margin coincide rather than the
  margin silently extending past where the obligation holds. Its binding
  cases are the late-greening through against the perpendicular release (T_AXIS at
  least 16 s plus the leading overhead) and the lagging left against the opposite
  crosswalk (the lag must not begin within 16 s of axis start); the leading left is
  safe by construction. The margin holds only while through movements run their full
  slot — the premise stated as the obligation in requirement 11 (no gap-out).

  The yellow-then-red ordering and the all-red barrier themselves live in the state
  machines (their *_YELLOW / *_CLEAR / NS_BARRIER_ALLRED states); this file only
  fixes how long those intervals last.

  Derived item (8) is pure arithmetic, defining T_BOTH in terms of (7) and the
  named durations.
