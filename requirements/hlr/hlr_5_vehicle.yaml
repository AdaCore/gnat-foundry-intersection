  47:
    text: |-
      When the controller starts up, the controller shall enter EW_BARRIER_ALLRED.
    source:
      - CONOPS §5.3

  # ==================== both-through no-lag continuation ====================
  # When the lag is skipped, the both-through phase continues through a HOLD
  # sub-state (same green faces as NS/EW_BOTH_THROUGH) that spends the interval
  # the skipped lag would have taken, so the service slot T_AXIS stays fixed
  # (`3_timing.7`, .8). The HOLD states carry the same output row as their
  # parent both-through state and exit unconditionally to the both-drop yellow.

  48:
    text: |-
