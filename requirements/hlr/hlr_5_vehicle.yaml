  11:
    text: |-
      While the controller is in NS_BARRIER_ALLRED, the controller shall hold every
      vehicle output signal at RED.
    source:
      - CONOPS §2.1
      - CONOPS §2.8

  # ---- NS transitions (entry from the EW barrier; Northbound left leads) ----

  12:
    text: |-
      While the controller is in EW_BARRIER_ALLRED and the Northbound left-turn
      demand machine is in LEFT_DEMAND_PENDING, when T_BARRIER has elapsed, the
      controller shall enter N_LEAD.
    source:
      - CONOPS §2.6

  13:
