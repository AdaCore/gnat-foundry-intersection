context: |-
  This is the vehicle phase sequencer, a region of the NORMAL_OPERATION mode
  (`1_modes`). It serves the NS and EW axes alternately, each through a lead-lag
  protected-left structure, closing the cycle EW_BARRIER_ALLRED -> NS service ->
  NS_BARRIER_ALLRED -> EW service -> ... A transition into the FAULT mode pre-empts
  this whole region and drives the `2_fault` outputs; that edge lives in `1_modes`,
  not here. While one axis is served, every face of the other axis is held RED. At
  power-on the sequencer enters EW_BARRIER_ALLRED (statement 47) — the steady all-red
  barrier that precedes NS (major-street) service — so the cold start presents steady
  red and then the major-street green, the sequence MUTCD 4G.04.01.B requires when
  leaving flashing operation (here, fault recovery by power cycle). Thereafter the
  cycle is closed (barrier -> next axis), so this power-on edge is the only
  unconditional entry.

  States and signal values are named; events are not — a transition fires when a
  named signal does something or when a timing interval elapses.

  Signals:
    - the eight vehicle face output signals (N_thru, S_thru, E_thru, W_thru,
      N_left, S_left, E_left, W_left) — value sets fixed in `4_signals`.
    - the four left-turn demand machines (observed) — states NO_LEFT_DEMAND /
      LEFT_DEMAND_PENDING, defined in `5_vehicle_1_left_demand`.

  The interval durations T_LEAD, T_LAG, T_YELLOW, T_REDCLEAR, and T_BARRIER are
  fixed in `3_timing`; the fixed-axis-slot and pedestrian-buffer constraints there
  make this machine's timing sound without observing pedestrian state. T_BOTH, the
  both-through phase, is the exception: `3_timing` defines it as the residual that
  holds each axis's service slot (T_AXIS) independent of left-turn demand, so it
  grows and shrinks with how much of the slot the lead and lag phases consume in a
  given cycle.

  The both-through phase is served in two parts so the lag decision can be taken as
  late as it can still be honoured. The both-through state (NS_BOTH_THROUGH /
  EW_BOTH_THROUGH) runs a commit interval sized to leave exactly enough of the slot
  for a full lagging-left block; the lagging approach's demand is read when that
  commit interval elapses (17/18, 40/41), so a left arriving any time before then is
  served this cycle. If the lag is demanded the phase ends there and the lag block
  runs; if not, the phase continues through the HOLD sub-state (NS_BOTH_THROUGH_HOLD
  / EW_BOTH_THROUGH_HOLD, 48-51) for the interval the lag block would have taken less
  the closing both-drop yellow, then drops. Either way the slot closes exactly at
  T_AXIS.

  The commit interval is the one dwell that is not a pure function of the current
  state — reaching the both-through state via the lead (16) versus directly (13)
  must yield different commit intervals — so this is a deliberate departure from
  strict Moore form, with the residual computation left to the LLR. The HOLD dwell,
  by contrast, is a fixed interval.

  Lead/lag: on each axis the first-named direction (Northbound, Eastbound) leads
  and the opposite (Southbound, Westbound) lags; either left is skipped when its
  demand machine is in NO_LEFT_DEMAND. The EW block is the exact mirror of the NS
  block, rotated 90 degrees.

description:
  # ============================ NS axis ============================

  1:
    text: |-
      While the controller is in NORMAL_OPERATION, the controller shall visit the
      NS-axis states N_LEAD, N_LEAD_YELLOW, N_LEAD_CLEAR, NS_BOTH_THROUGH,
      N_DROP_YELLOW, N_DROP_CLEAR, S_LAG, S_LAG_YELLOW, NS_BOTH_THROUGH_HOLD,
      NS_BOTH_DROP_YELLOW, and NS_BARRIER_ALLRED only in that relative order; on
      any given cycle a state is omitted when it is not reached because a left-turn
      demand machine is in NO_LEFT_DEMAND (per transitions 12-23, 49).
    source:
      - CONOPS §5.1
      - CONOPS §2.6

  # ---- NS Moore outputs (all unlisted faces held RED) ----

  2:
    text: |-
      While the controller is in N_LEAD, the controller shall drive the N_thru output
      signal to GREEN and the N_left output signal to GREEN, and hold all other
      vehicle output signals at RED.
    source:
      - CONOPS §2.1
      - CONOPS §2.2
      - CONOPS §2.6
      - CONOPS §2.7

  3:
    text: |-
      While the controller is in N_LEAD_YELLOW, the controller shall drive the N_thru
      output signal to GREEN and the N_left output signal to YELLOW, and hold all
      other vehicle output signals at RED.
    source:
      - CONOPS §2.1
      - CONOPS §2.5

  4:
    text: |-
      While the controller is in N_LEAD_CLEAR, the controller shall drive the N_thru
      output signal to GREEN, and hold all other vehicle output signals at RED.
    source:
      - CONOPS §2.1
      - CONOPS §2.5

  5:
    text: |-
      While the controller is in NS_BOTH_THROUGH, the controller shall drive the
      N_thru output signal and the S_thru output signal to GREEN, and hold all other
      vehicle output signals at RED.
    source:
      - CONOPS §2.1
      - CONOPS §2.2

  6:
    text: |-
      While the controller is in N_DROP_YELLOW, the controller shall drive the N_thru
      output signal to YELLOW and the S_thru output signal to GREEN, and hold all
      other vehicle output signals at RED.
    source:
