rationale: |-
  A single serialized Moore machine over both axes: every face value is a function
  of the current state (the output rows 2-11 / 25-34), and transitions are
  triggered by the left-turn demand machines or by elapsed timing intervals.
  Serializing the phases, rather than running two concurrent NEMA rings, is what
  keeps it a Moore machine.

  "No conflicting greens" (CONOPS §2.8) is a per-state check: the non-RED faces in
  every output row are mutually non-conflicting. Clearance (§2.5) is per
  conflicting-pair, not intersection-wide: leaving N_LEAD clears only N_left (which
  conflicts with the incoming S_thru) while N_thru runs on; leaving NS_BOTH_THROUGH
  toward the lag clears only N_thru while S_thru runs on. A full all-red
  (NS_BARRIER_ALLRED / EW_BARRIER_ALLRED) appears only at the axis change, where
  every outgoing movement conflicts with every incoming one; that barrier state IS
  the next axis's entry point (12/13 enter from EW_BARRIER_ALLRED, 35/36 from
  NS_BARRIER_ALLRED), so the cycle closes.

  Protected-only left turns (§2.6, §2.7) run concurrently with their own through
  and are skipped on no demand (13/36 bypass the lead branch; 18/41 skip the lag,
  continuing through the both-through HOLD sub-state to fill the slot before the
  drop). The corresponding left-turn demand machine is reset not on entry to the
  lead/lag but when that approach's next conflicting movement is released — i.e. when
  that movement's through face becomes GREEN at the end of the left's all-red
  clearance (`5_vehicle_1_left_demand.4`) — so the still-present triggering vehicle
  cannot re-arm it within the same phase.

  The EW block (24, 25-34, 35-46) is the exact mirror of the NS block (1, 2-11,
  12-23) with E/W substituted for N/S. The duplication is a cost of the flat
  requirements form; a parameterized axis sub-machine instantiated twice would be
  the DRY alternative and is worth considering when these sketches are farmed out.
