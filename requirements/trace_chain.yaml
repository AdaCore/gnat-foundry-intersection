# Traceability chain, top to bottom; `reqs trace` checks each (parent, child)
# pair both ways. Paths are relative to this file. `parent` defaults to the
# entry above, so the layers below LLR make the list a tree. A `method` layer
# must cover exactly the LLRs declaring that verification method; there is no
# layer for `review`, which carries no machine evidence.
layers:
  - name: CONOPS
    kind: markdown-leaves
    path: conops.md
    waivers: trace_waivers.yaml
  - name: HLR
    kind: requirement-yaml
    path: hlr
    id_pattern: 'CONOPS §(\d+\.\d+)'
  - name: LLR
    kind: requirement-yaml
    path: llr
    id_pattern: '(.+\.\d+)'
  # The layers below are read from generated inventories (`make inventories`,
  # needs the Ada toolchain): `make validate-reqs` selects CONOPS,HLR,LLR via
  # --layers, `make trace-check` and `make trace` take the whole chain.
  - name: TEST
    kind: ada-tests
    path: ../obj/analysis/test_inventory.json
    parent: LLR
    id_pattern: '(.+\.\d+)'
    method: test  # also keeps an empty inventory loud: test-verified LLRs go uncovered
    # THIS INVENTORY DOES NOT REACH THE REQUIREMENTS-BASED TESTS (#106), so most
    # of what `method: test` demands is currently invisible to it: `#51` put 98
    # tagged routines under tests/reqs/, and none of them are counted.
    # `test-inventory` runs `ada_tracer` on the harness project without `-U`, and
    # without `-U` the tracer reads the root project's own sources alone. The
    # generated harness project's `Source_Dirs` are tests/core, tests/hal/common,
    # tests/types and its own `common`; tests/reqs/ arrives through an *imported*
    # project (`--additional-tests=tests/reqs/reqs_tests.gpr`). Plain `-U` is not
    # the fix -- it would pull the application into a layer that requires every
    # node to carry a `--@covers` tag.
    #
    # Until #106 lands, expect this layer to report nearly every `test`-verified
    # statement uncovered. The tags themselves are already in the syntax and
    # position this layer wants; it is the inventory that cannot see them.
  - name: CODE
    kind: ada-entities
    path: ../obj/analysis/code_inventory.json
    parent: LLR
    refs_point_down: true   # the LLR names the code, not the reverse
    ref_field: implemented_by
    partial_coverage: true  # code no LLR names is expected, never flagged
  # PROOF/STATIC read the source's `--@covers`-tagged checks (`anchors` says
  # which constructs count for which method).
  - name: PROOF
    kind: ada-checks
    path: ../obj/analysis/code_inventory.json
    parent: LLR
    id_pattern: '(.+\.\d+)'
    method: proof
    anchors:
      - aspect:Post
  - name: STATIC
    kind: ada-checks
    path: ../obj/analysis/code_inventory.json
    parent: LLR
    id_pattern: '(.+\.\d+)'
    method: static_check
    anchors:  # named, not bare `pragma`: a tagged runtime pragma must not count
      - pragma:Compile_Time_Error
      - aspect:No_Return
