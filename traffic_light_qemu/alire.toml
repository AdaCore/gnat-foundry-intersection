name = "traffic_light_qemu"
description = "Bare-metal arm-eabi (Cortex-A9) QEMU build of traffic_light"
version = "0.1.0-dev"
authors = ["AdaCore"]
maintainers = ["AdaCore <support@adacore.com>"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = "https://gitlab.com/mark/traffic-light-controller"
tags = ["embedded", "ada", "spark", "arm", "qemu", "zynq"]

# Cross-target sibling of the root `traffic_light` crate. The root crate is
# native-only (host build, gnattest, gnatprove); this crate owns the arm-eabi
# cross toolchain. They are separate crates because native and gnat_arm_elf
# both provide the abstract `gnat`, and an Alire solution allows only one
# compiler. Sources are shared from the repo-root src/ tree, referenced via
# ../ in the GPR (no path pin needed).
#
# The runtime is the toolchain-bundled `light-tasking-zynq7000` (Cortex-A9,
# Ravenscar tasking), selected by name in traffic_light_qemu.gpr - no extra
# runtime crate is needed, and the runtime supplies the target CPU/FPU
# switches itself (so there is no BARE_RUNTIME_SWITCHES external here).
project-files = ["traffic_light_qemu.gpr"]

[[depends-on]]
gnat_arm_elf = "*"

# Light-tasking runtimes do not support stack overflow checking
[gpr-set-externals]
STACK_CHECK = "disabled"
BUILD_KIND = "target"

[gpr-externals]
TICK_PERIOD_US = ["1000", "300", "10"]

